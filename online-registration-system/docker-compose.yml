version: '3.8'

services:
  student-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: student-service
        SERVICE_PORT: 8081
    ports:
      - "8081:8081"
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/studentdb
      SPRING_DATASOURCE_USERNAME: azubi
      SPRING_DATASOURCE_PASSWORD: pgres418

  registration-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: registration-service
        SERVICE_PORT: 8083
    ports:
      - "8083:8083"
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/registrationdb
      SPRING_DATASOURCE_USERNAME: azubi
      SPRING_DATASOURCE_PASSWORD: pgres418
      SPRING_PROFILES_ACTIVE: registration-service

  course-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: course-service
        SERVICE_PORT: 8082
    ports:
      - "8082:8082"
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/coursedb
      SPRING_DATASOURCE_USERNAME: azubi
      SPRING_DATASOURCE_PASSWORD: pgres418
      SPRING_PROFILES_ACTIVE: course-service
