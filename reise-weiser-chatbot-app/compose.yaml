services:
  database:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
        - "${PGADMIN_PORT:?PGADMIN_PORT is required}:80"
    volumes:
        - pgadmin_data:/var/lib/pgadmin
    depends_on:
        database:
          condition: service_healthy

volumes:
    postgres_data:
    pgadmin_data:
