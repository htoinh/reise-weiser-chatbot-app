services:
  database:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reiseweiser}
      POSTGRES_USER: ${POSTGRES_USER:-reiseweiser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-choose_a_local_pgadmin_password}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-reiseweiser} -d ${POSTGRES_DB:-reiseweiser}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@reiseweiser.com}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-choose_a_local_pgadmin_password}
    ports:
        - "${PGADMIN_PORT:-5050}:80"
    volumes:
        - pgadmin_data:/var/lib/pgadmin
    depends_on:
        database:
          condition: service_healthy

volumes:
    postgres_data:
    pgadmin_data:
