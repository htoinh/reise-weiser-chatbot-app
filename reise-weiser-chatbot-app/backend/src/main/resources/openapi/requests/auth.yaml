RegisterRequest:
  type: object
  required:
    - email
    - password
    - name
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 50
      example: newuser@example.com
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      example: Password123!
    name:
      type: string
      minLength: 1
      maxLength: 150
      pattern: '.*\S.*'
      example: New User

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 50
      example: user@example.com
    password:
      type: string
      format: password
      minLength: 1
      maxLength: 72
      example: Password123!
