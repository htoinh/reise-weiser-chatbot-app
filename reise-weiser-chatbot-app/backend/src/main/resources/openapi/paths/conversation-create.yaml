post:
  tags: [Chat]
  operationId: createConversation
  summary: Start a new conversation
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Conversation created successfully
      content:
        application/json:
          schema:
            $ref: '../responses/conversation.yaml#/ConversationResponse'
    '401':
      description: Authentication required


