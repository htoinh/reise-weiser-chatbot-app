post:
  tags:
    - Authentication
  operationId: loginUser
  summary: Log in
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/auth.yaml#/LoginRequest'
  responses:
    '200':
      description: Successful login
      content:
        application/json:
          schema:
            $ref: '../responses/auth.yaml#/AuthResponse'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../responses/error.yaml#/BadRequest'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../responses/error.yaml#/Unauthorized'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../responses/error.yaml#/InternalServerError'
