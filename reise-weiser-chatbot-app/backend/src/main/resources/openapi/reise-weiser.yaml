openapi: 3.0.3
info:
  title: ReiseWeiser Chatbot API
  version: 0.0.1
  description: API Documentation for the ReiseWeiser Travel Chatbot.

servers:
  - url: /

paths:
  /register:
    $ref: './paths/auth-register.yaml'
  /login:
    $ref: './paths/auth-login.yaml'
  /current-user:
    $ref: './paths/auth-current-user.yaml'
  /chat-history:
    $ref: './paths/chat-history.yaml'
  /chatbot/message:
    $ref: './paths/chat-send.yaml'
  /chatbot/conversation:
    $ref: './paths/conversation-create.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      $ref: './requests/auth.yaml#/RegisterRequest'
    LoginRequest:
      $ref: './requests/auth.yaml#/LoginRequest'
    ChatRequest:
      $ref: './requests/chat.yaml#/ChatMessageRequest'
    ChatResponse:
      $ref: './responses/chat.yaml#/ChatMessageResponse'
    ConversationResponse:
      $ref: './responses/conversation.yaml#/ConversationResponse'
    Error:
      $ref: './responses/error.yaml#/Error'

security:
  - bearerAuth: []




